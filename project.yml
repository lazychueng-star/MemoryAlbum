name: MemoryAlbum

options:
  bundleIdPrefix: com.memorycottage
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: zh-Hant
  groupSortPosition: top
  minimumXcodeGenVersion: 2.42.0

configs:
  Debug: debug
  Release: release

settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

packages:
  Nuke:
    url: https://github.com/kean/Nuke.git
    exactVersion: 13.2.0

targets:
  MemoryAlbum:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
        excludes:
          - "TestTarget/**"
      - path: Domain
      - path: Data/Persistence
    dependencies:
      - package: Nuke
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MemoryAlbum
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.memorycottage.app
        PRODUCT_NAME: MemoryAlbum
        TARGETED_DEVICE_FAMILY: "1,2"

  MemoryAlbumTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App/TestTarget
      - path: Tests/Domain
      - path: Tests/Fixtures
    dependencies:
      - target: MemoryAlbum
    settings:
      base:
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.memorycottage.app.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MemoryAlbum.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/MemoryAlbum"

schemes:
  MemoryAlbum:
    build:
      targets:
        MemoryAlbum: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MemoryAlbumTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
