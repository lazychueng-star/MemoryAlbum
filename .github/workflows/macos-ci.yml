name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify iOS baseline
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Record toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun swift --version
          xcodegen --version

      - name: Run fast verification
        shell: bash
        run: |
          set -o pipefail
          pattern='error:|Testing failed|BUILD FAILED|Test Case .* failed|Command .* failed|\*\* TEST FAILED \*\*'

          if bash scripts/verify.sh fast 2>&1 | tee verify.log; then
            exit 0
          fi

          {
            echo "### Fast verification failed"
            echo '```text'
            grep -E "$pattern" verify.log | tail -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          details="$(
            grep -E "$pattern" verify.log | tail -n 20 || true
          )"
          if [[ -z "$details" ]]; then
            details="$(tail -n 20 verify.log)"
          fi

          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Fast verification::${details}"
          exit 1
