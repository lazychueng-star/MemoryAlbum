name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify iOS baseline
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Record toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun swift --version
          xcodegen --version

      - name: Run fast verification
        run: bash scripts/verify.sh fast
