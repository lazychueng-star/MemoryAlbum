name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify iOS baseline
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Record toolchain
        shell: bash
        run: |
          toolchain="$({
            xcode-select -p
            xcodebuild -version
            xcrun swift --version
            xcodegen --version
          } 2>&1)"
          printf '%s\n' "$toolchain"
          toolchain="${toolchain//'%'/'%25'}"
          toolchain="${toolchain//$'\r'/'%0D'}"
          toolchain="${toolchain//$'\n'/'%0A'}"
          echo "::notice title=Toolchain::${toolchain}"

      - name: Run fast verification
        shell: bash
        run: |
          set -o pipefail
          pattern='error:|Testing failed|BUILD FAILED|Test Case .* failed|Command .* failed|\*\* TEST FAILED \*\*'

          if bash scripts/verify.sh fast 2>&1 | tee verify.log; then
            exit 0
          fi

          {
            echo "### Fast verification failed"
            echo '```text'
            grep -E "$pattern" verify.log | tail -n 80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          details="$(
            grep -E "$pattern" verify.log | tail -n 20 || true
          )"
          if [[ -z "$details" ]]; then
            details="$(tail -n 20 verify.log)"
          fi

          details="${details//'%'/'%25'}"
          details="${details//$'\r'/'%0D'}"
          details="${details//$'\n'/'%0A'}"
          echo "::error title=Fast verification::${details}"
          exit 1

      - name: Publish test summary
        if: success()
        shell: bash
        run: |
          result_bundle="$(
            find .build/DerivedData/Logs/Test -type d -name '*.xcresult' -print |
              sort | tail -n 1
          )"
          test_summary="$(
            xcrun xcresulttool get test-results summary \
              --path "$result_bundle" \
              --format json
          )"
          printf '%s\n' "$test_summary"
          test_summary="${test_summary//'%'/'%25'}"
          test_summary="${test_summary//$'\r'/'%0D'}"
          test_summary="${test_summary//$'\n'/'%0A'}"
          echo "::notice title=Test summary::${test_summary}"
