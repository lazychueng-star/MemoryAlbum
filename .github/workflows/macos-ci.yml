name: macOS CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify iOS baseline
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Record toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun swift --version
          xcodegen --version

      - name: Run fast verification
        shell: bash
        run: |
          set -o pipefail
          if bash scripts/verify.sh fast 2>&1 | tee verify.log; then
            exit 0
          fi

          {
            echo "### Fast verification failed"
            echo '```text'
            grep -E 'error:|Testing failed|BUILD FAILED|Test Case .* failed|** TEST FAILED **' verify.log |
              tail -n 30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          details="$(
            grep -E 'error:|Testing failed|BUILD FAILED|Test Case .* failed|** TEST FAILED **' verify.log |
              tail -n 5 || true
          )"
          if [[ -z "$details" ]]; then
            details="$(tail -n 5 verify.log)"
          fi

          while IFS= read -r line; do
            line="${line//'%'/'%25'}"
            line="${line//$'\r'/'%0D'}"
            line="${line//$'\n'/'%0A'}"
            echo "::error title=Fast verification::${line}"
          done <<< "$details"
          exit 1
